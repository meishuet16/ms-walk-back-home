name: Finalize authored edits (temporary)

on:
  push:
    branches:
      - feat/journal-ui-pdf-polish
    paths:
      - .github/workflows/finalize-authored-temp.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/journal-ui-pdf-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply final authored wording edits
        run: |
          python - <<'PY'
          from pathlib import Path
          edits = {
            Path('apps/html-prototype/src/fixtures/june25Chapter.ts'): [
              ('只是她没有留下来了。', '只是她留下来了。'),
            ],
            Path('apps/html-prototype/src/fixtures/authoredDiaryEntries.ts'): [
              ('location: "KTHO Lobby"', 'location: "Lobby"'),
              ('location: "KTHO residential-college entrance / front sitting area"', 'location: "front sitting area"'),
              ('location: "KTHO",\n    weather: "Rain"', 'location: "lobby",\n    weather: "Rain"'),
            ],
          }
          for path, replacements in edits.items():
              text = path.read_text()
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one match for {old!r}, found {count}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY
      - run: npm run authored:update
      - name: Commit edits and generated expectations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/html-prototype/src/fixtures/june25Chapter.ts apps/html-prototype/src/fixtures/authoredDiaryEntries.ts
          git add -f apps/html-prototype/src/fixtures/generated/authoredContentExpectations.ts
          git commit -m "Finalize authored chapter wording"
          git push

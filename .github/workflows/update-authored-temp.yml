name: Update authored expectations (temporary)

on:
  push:
    branches:
      - feat/journal-ui-pdf-polish

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/journal-ui-pdf-polish
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Regenerate expectations and remove temporary workflow
        run: |
          npm run authored:update
          rm .github/workflows/update-authored-temp.yml
      - name: Commit generated expectations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apps/html-prototype/src/fixtures/generated/authoredContentExpectations.ts
          git add .github/workflows/update-authored-temp.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Update authored content expectations"
          git push origin HEAD:feat/journal-ui-pdf-polish

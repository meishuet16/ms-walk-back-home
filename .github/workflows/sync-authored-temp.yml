name: Sync authored expectations (temporary)

on:
  push:
    branches:
      - feat/journal-ui-pdf-polish
    paths:
      - .github/workflows/sync-authored-temp.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/journal-ui-pdf-polish
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Regenerate authored expectations
        run: npm run authored:update

      - name: Commit generated expectations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apps/html-prototype/src/fixtures/generated/authoredContentExpectations.ts
          if git diff --cached --quiet; then
            echo "No authored expectation changes needed."
          else
            git commit -m "Update authored content expectations"
            git push
          fi

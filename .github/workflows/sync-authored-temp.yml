name: Sync Authored Expectations Temp

on:
  push:
    branches:
      - feat/journal-ui-pdf-polish
    paths:
      - '.github/workflows/sync-authored-temp.yml'
      - 'apps/html-prototype/src/**'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/journal-ui-pdf-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Update authored expectations
        run: npm run authored:update
      - name: Commit generated expectations if changed
        shell: bash
        run: |
          if git diff --quiet -- apps/html-prototype/src/fixtures/generated/authoredContentExpectations.ts; then
            echo "No authored expectation changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apps/html-prototype/src/fixtures/generated/authoredContentExpectations.ts
          git commit -m "Sync authored content expectations"
          git push origin HEAD:feat/journal-ui-pdf-polish

# Trigger after workflow registration.

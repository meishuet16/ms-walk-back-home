name: Sync Authored Tests Temp

on:
  push:
    branches:
      - feat/journal-ui-pdf-polish
    paths:
      - '.github/workflows/sync-authored-tests-temp.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/journal-ui-pdf-polish
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Finish stale authored regression expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in [
              'apps/html-prototype/tests/april25-chapter.test.ts',
              'apps/html-prototype/tests/june24-chapter.test.ts',
          ]:
              p = Path(name)
              s = p.read_text().replace('"Angela"', '"朋友"')
              p.write_text(s)

          p = Path('apps/html-prototype/tests/march30-refined-runtime.test.ts')
          s = p.read_text()
          s = s.replace(
              'assert.equal(sequence.beats[0].portrait, "");',
              'assert.equal(sequence.beats[0].portrait, "/assets/1122/memory-portrait/echo-bye.png");'
          )
          s = s.replace(
              'assert.doesNotMatch(rendered, /memory-portrait-image/);',
              'assert.match(rendered, /memory-portrait-image/);\n  assert.match(rendered, /assets\\/1122\\/memory-portrait\\/echo-bye\\.png/);'
          )
          p.write_text(s)

          p = Path('apps/html-prototype/tests/june24-chapter.test.ts')
          s = p.read_text()
          old = '"她", "我", "她", "我", "她", "我", "她", "我", "我", "她", "她", "我", "她", "我", "她", "我", "她", "她", "我", "她", "她", "我", "我", "她", "我", "她", "我", "她", "我", "我", "她", "我", "她", "我", "她", "我", "她", "我", "她", "我", "她", "我", "她", "我", "她", "她", "我", "她", "我", "我", "她"'
          new = '"她", "我", "她", "我", "她", "我", "她", "我", "她", "她", "我", "她", "我", "她", "她", "我", "她", "我", "我", "她", "我", "她", "她", "我", "她", "我", "她", "她", "我", "我", "她", "我", "她", "我", "她", "我", "我", "她", "我", "她", "我", "她", "我", "她", "我", "她", "我", "她", "我", "她", "我", "她", "她", "我", "她", "我", "她"'
          if old not in s:
              raise SystemExit('June24 stale speaker sequence not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Verify full repository
        id: verify
        continue-on-error: true
        run: |
          set +e
          npm run verify > verify-output.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: authored-verify-output
          path: verify-output.txt
      - name: Commit synchronized expectations
        if: steps.verify.outputs.exit_code == '0'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/html-prototype/tests
          git commit -m "Finish authored regression expectation sync"
          git push origin HEAD:feat/journal-ui-pdf-polish
      - name: Fail if verify failed
        if: steps.verify.outputs.exit_code != '0'
        run: exit 1

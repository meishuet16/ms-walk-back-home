name: Normalize selected chapter speakers (temporary)

on:
  push:
    branches:
      - feat/journal-ui-pdf-polish

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/journal-ui-pdf-polish
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install
      - name: Replace speaker labels only
        shell: python
        run: |
          from pathlib import Path
          import re

          files = [
              "apps/html-prototype/src/fixtures/oct29Chapter.ts",
              "apps/html-prototype/src/fixtures/november22Chapter.ts",
              "apps/html-prototype/src/fixtures/march30Chapter.ts",
              "apps/html-prototype/src/fixtures/march30Memory.ts",
              "apps/html-prototype/src/fixtures/march30RefinedChapter.ts",
              "apps/html-prototype/src/fixtures/april05Chapter.ts",
              "apps/html-prototype/src/fixtures/april06Chapter.ts",
              "apps/html-prototype/src/fixtures/april25Chapter.ts",
              "apps/html-prototype/src/fixtures/may23Chapter.ts",
              "apps/html-prototype/src/fixtures/june24Chapter.ts",
              "apps/html-prototype/src/fixtures/june25Chapter.ts",
              "apps/html-prototype/src/fixtures/labisMotorChapter.ts",
              "apps/html-prototype/src/fixtures/labisMotorMemory.ts",
              "apps/html-prototype/src/fixtures/labisMemoryEchoes.ts",
              "apps/html-prototype/src/fixtures/july21Chapter.ts",
          ]
          mapping = {"ms": "我", "et": "她", "ziqi": "朋友", "st": "朋友", "angela": "朋友"}

          # Only speaker-bearing syntax is touched: speaker: "NAME" and dialogue("NAME", ...).
          speaker_prop = re.compile(r'(\bspeaker\s*:\s*["\'])(ms|et|ziqi|st|angela)(["\'])', re.I)
          dialogue_arg = re.compile(r'(\bdialogue\(\s*["\'])(ms|et|ziqi|st|angela)(["\'])', re.I)

          total = 0
          for filename in files:
              path = Path(filename)
              if not path.exists():
                  raise SystemExit(f"Expected target file missing: {filename}")
              text = path.read_text(encoding="utf-8")
              count = 0
              def repl(m):
                  nonlocal_count[0] += 1
                  return m.group(1) + mapping[m.group(2).lower()] + m.group(3)
              nonlocal_count = [0]
              updated = speaker_prop.sub(repl, text)
              updated = dialogue_arg.sub(repl, updated)
              count = nonlocal_count[0]
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  print(f"{filename}: {count} speaker label(s) changed")
                  total += count
          print(f"TOTAL speaker labels changed: {total}")
          if total == 0:
              raise SystemExit("No target speaker labels found; refusing a no-op commit")
      - name: Sync authored expectations
        run: npm run authored:update
      - name: Remove temporary workflow
        run: rm .github/workflows/normalize-chapter-speakers-temp.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/html-prototype/src/fixtures/oct29Chapter.ts apps/html-prototype/src/fixtures/november22Chapter.ts apps/html-prototype/src/fixtures/march30Chapter.ts apps/html-prototype/src/fixtures/march30Memory.ts apps/html-prototype/src/fixtures/march30RefinedChapter.ts apps/html-prototype/src/fixtures/april05Chapter.ts apps/html-prototype/src/fixtures/april06Chapter.ts apps/html-prototype/src/fixtures/april25Chapter.ts apps/html-prototype/src/fixtures/may23Chapter.ts apps/html-prototype/src/fixtures/june24Chapter.ts apps/html-prototype/src/fixtures/june25Chapter.ts apps/html-prototype/src/fixtures/labisMotorChapter.ts apps/html-prototype/src/fixtures/labisMotorMemory.ts apps/html-prototype/src/fixtures/labisMemoryEchoes.ts apps/html-prototype/src/fixtures/july21Chapter.ts
          git add -f apps/html-prototype/src/fixtures/generated/authoredContentExpectations.ts
          git add .github/workflows/normalize-chapter-speakers-temp.yml
          git commit -m "Normalize authored chapter speaker labels"
          git push origin HEAD:feat/journal-ui-pdf-polish
